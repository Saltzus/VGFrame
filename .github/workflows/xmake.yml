name: xmake build
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [release]
        
    steps:
    - uses: actions/checkout@v4

    - name: Install Linux deps
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev
    
    - name: setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        build-cache: true
        build-cache-key: ${{ matrix.os }}
      
    - name: Xmake Config
      run: xmake f -m ${{ matrix.build_type }} -y

    - name: Xmake Build
      run: xmake -y
